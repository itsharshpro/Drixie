services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listed
      POSTGRES_PASSWORD: listed
      POSTGRES_DB: listed
    ports:
      - "55433:5432"
    volumes:
      - listed_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listed"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  listed_pg:
