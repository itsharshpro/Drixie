[workspace]
resolver = "2"
members = ["common", "funds"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.2"
near-contract-standards = "5.30.2"
uint = { version = "0.10", default-features = false }
listed-common = { path = "common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
